name: C++ library unit tests

on:
  push:
  pull_request:

jobs:
  mingw64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python
      - name: Compiler information
        shell: msys2 {0}
        run: |
          c++ --version
          meson --version
      - name: Configure and compile Heim tests
        shell: msys2 {0}
        run: |
          meson setup build -Dheim_tests=true
          meson compile -C build
      - name: Execute unit suites
        shell: msys2 {0}
        run: meson test -C build --print-errorlogs
