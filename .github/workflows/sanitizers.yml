name: C++ library sanitizers

on:
  push:
  pull_request:

jobs:
  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      CC: gcc-16
      CXX: g++-16
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

    steps:
      - uses: actions/checkout@v4

      - name: Install GCC 16 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16 meson ninja-build

      - name: Show toolchain versions
        run: |
          g++-16 --version
          meson --version

      - name: Configure sanitized tests
        run: |
          meson setup build-sanitized \
            -Dheim_tests=true \
            -Dbuildtype=debug \
            -Db_sanitize=address,undefined \
            -Dcpp_args=-fno-omit-frame-pointer

      - name: Compile
        run: meson compile -C build-sanitized

      - name: Execute sanitized tests
        run: |
          meson test -C build-sanitized \
            --print-errorlogs \
            --timeout-multiplier 5 \
            --num-processes 2
