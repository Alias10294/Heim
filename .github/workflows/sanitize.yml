name: Sanitizers

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asan-ubsan:
    name: Linux / GCC 16 / ASan + UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CC: gcc-16
      CXX: g++-16
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install GCC 16 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16 meson ninja-build git

      - name: Configure with AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          $CXX --version
          meson setup build-sanitized \
            -Dheim_tests=true \
            -Dcpp_std=c++23 \
            -Dbuildtype=debug \
            -Db_sanitize=address,undefined \
            -Dcpp_args=-fno-omit-frame-pointer

      - name: Build
        run: meson compile -C build-sanitized -j 2

      - name: Run sanitized tests
        run: |
          meson test -C build-sanitized \
            --print-errorlogs \
            --timeout-multiplier 3 \
            --num-processes 2
