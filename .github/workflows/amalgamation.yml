name: Single-include integrity

on:
  push:
  pull_request:

jobs:
  amalgamation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify generated distribution headers
        run: python scripts/generate_single_include.py --check
